<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Band 9 Grammar & Collocation Drill</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 650px;
            width: 100%;
        }
        h2 { color: #1e3a8a; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .prompt-box {
            background-color: #eff6ff;
            border-left: 5px solid #3b82f6;
            padding: 15px;
            margin: 20px 0;
            font-style: italic;
        }
        .instruction { font-weight: bold; margin-bottom: 10px; color: #475569; }
        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-btn:hover { background: #e2e8f0; }
        .correct { background-color: #d1fae5 !important; border-color: #10b981 !important; color: #065f46; font-weight: bold; }
        .incorrect { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; }
        .feedback { margin-top: 15px; font-weight: bold; display: none; padding: 10px; border-radius: 5px; }
        .nav-btns { display: flex; justify-content: space-between; margin-top: 20px; }
        button.nav { background: #1e3a8a; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        button.nav:hover { background: #172554; }
    </style>
</head>
<body>

<div class="container">
    <h2>IELTS Band 9 Syntax & Collocation Drill</h2>
    <p>Transform the simple conditional prompt into an advanced, inverted subjunctive sentence using formal academic collocations.</p>
    
    <div class="instruction">Base Prompt (Band 6 Level):</div>
    <div class="prompt-box" id="base-prompt">Loading prompt...</div>

    <div class="instruction">Select the Band 9 Transformation:</div>
    <div id="options-container"></div>

    <div class="feedback" id="feedback-box"></div>

    <div class="nav-btns">
        <button class="nav" onclick="checkAnswer()">Verify Choice</button>
        <button class="nav" onclick="nextQuestion()">Next Scenario &rarr;</button>
    </div>
</div>

<script>
    const drillData = [
        {
            base: "If the hospital has enough budget, the crisis will end.",
            options: [
                "Were the hospital adequate fiscal resources, the crisis alleviate systemic agency.",
                "Were the hospital to possess adequate fiscal resources, pressures across the systemic agency would be alleviated.",
                "If the hospital were to have enough budget, the system agency crisis would end up."
            ],
            correct: 1,
            rationale: "Correct. Uses 'Were + Subject + to + Verb' perfectly, couples it with 'possess adequate fiscal resources', and accurately treats 'alleviate' as a passive transformation ('pressures... would be alleviated')."
        },
        {
            base: "If the city controls the growing population, it will stop the bad traffic crisis.",
            options: [
                "Were municipal authorities to curb the exponential growth of the population, the critical transit crisis would be precipitated.",
                "Were municipal authorities to curb the exponential growth of the population, the severe transit crisis would be effectively averted.",
                "Had the city controlled the growing population, traffic would end."
            ],
            correct: 1,
            rationale: "Correct. 'Curb the exponential growth' replaces 'controls the growing', and 'transit crisis... averted' correctly elevates the second clause."
        },
        {
            base: "If the school gives enough money to science, it will have a big effect on students.",
            options: [
                "Were academic institutions to allocate adequate financial capital to scientific research, it would exert a profound influence on student development.",
                "Were schools giving enough money to science, a big effect would be had on students.",
                "If the school allocated financial capital, students exert a profound influence."
            ],
            correct: 0,
            rationale: "Correct. 'Allocate adequate financial capital' seamlessly replaces 'gives enough money', while 'exert a profound influence' is the precise academic collocation for 'have a big effect'."
        }
    ];

    let currentQuestion = 0;
    let selectedOption = null;

    function loadQuestion() {
        selectedOption = null;
        document.getElementById('feedback-box').style.display = 'none';
        const q = drillData[currentQuestion];
        document.getElementById('base-prompt').innerText = `"${q.base}"`;
        
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        
        q.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectOpt(idx, btn);
            container.appendChild(btn);
        });
    }

    function selectOpt(idx, element) {
        selectedOption = idx;
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(b => b.style.borderColor = '#cbd5e1');
        element.style.borderColor = '#3b82f6';
    }

    function checkAnswer() {
        if (selectedOption === null) return alert("Please select an option first!");
        const q = drillData[currentQuestion];
        const btns = document.querySelectorAll('.option-btn');
        const feedback = document.getElementById('feedback-box');
        
        feedback.style.display = 'block';
        if (selectedOption === q.correct) {
            btns[selectedOption].classList.add('correct');
            feedback.className = 'feedback correct';
            feedback.innerText = q.rationale;
        } else {
            btns[selectedOption].classList.add('incorrect');
            btns[q.correct].classList.add('correct');
            feedback.className = 'feedback incorrect';
            feedback.innerText = "Incorrect. Look closely at the verb restrictions or collocations used. " + q.rationale;
        }
    }

    function nextQuestion() {
        currentQuestion = (currentQuestion + 1) % drillData.length;
        loadQuestion();
    }

    window.onload = loadQuestion;
</script>

</body>
</html>
